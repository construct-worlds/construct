[package]
name = "construct-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "construct daemon: supervises agent sessions across harnesses"

# Library-only: the daemon runtime is driven by `construct daemon` (see
# `crates/cli`). There is no standalone daemon binary.

[dependencies]
construct-protocol = { workspace = true }
construct-adapter-common = { workspace = true }
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
uuid.workspace = true
chrono.workspace = true
toml.workspace = true
toml_edit.workspace = true
nix.workspace = true
libc = "0.2"
which.workspace = true
futures.workspace = true
async-trait.workspace = true
base64.workspace = true
vt100.workspace = true
# Console PTY (a browser-rendered instance of our own TUI client).
portable-pty.workspace = true
tokio-tungstenite.workspace = true
qrcode.workspace = true
httparse.workspace = true
zstd.workspace = true
reqwest.workspace = true
wstunnel.workspace = true
# Router TLS interception (spec 0113). Pinned to the `ring` backend to
# match the workspace's reqwest/rustls stack — the default `aws-lc-rs`
# backend drags in a cmake/C build that the rest of the workspace avoids.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# Reads the platform trust store (macOS keychain / Linux PEM dirs) so the
# router can compose "system roots + our CA" for harnesses whose CA
# variable replaces the roots rather than adding to them (spec 0113).
rustls-native-certs = "0.8"

[dev-dependencies]
tempfile = "3"
